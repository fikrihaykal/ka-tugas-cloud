apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web2-deployment
  labels:
    app: web2
spec:
  serviceName: web2-service
  replicas: 5
  selector:
    matchLabels:
      app: web2
  template:
    metadata:
      labels:
        app: web2
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
---
kind: Service
apiVersion: v1
metadata:
  name: web2-service
spec:
  selector:
    app: web2
  ports:
  # Default port used by the image
  - port: 80
---
