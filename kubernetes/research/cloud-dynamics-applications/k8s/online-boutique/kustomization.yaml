apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud-dynamics
resources:
  - ../../../../../../ka-ecommerce-microservices/release/kubernetes-manifests.yaml
  - service.yaml
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: loadgenerator
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
