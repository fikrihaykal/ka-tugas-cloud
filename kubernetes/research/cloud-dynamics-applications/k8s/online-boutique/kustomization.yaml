apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloud-dynamics
resources:
  - ../../../../../../ka-ecommerce-microservices/release/kubernetes-manifests.yaml
  - service.yaml
replicas:
  - name: frontend
    count: 8
  - name: currencyservice
    count: 10
  - name: productcatalogservice
    count: 5
  - name: cartservice
    count: 4
  - name: adservice
    count: 3
  - name: redis-cart
    count: 1
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: loadgenerator
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
